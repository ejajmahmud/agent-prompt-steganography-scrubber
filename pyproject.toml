[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-prompt-steganography-scrubber"
version = "0.1.0"
description = "Unicode zero-width character, invisible watermark, and homoglyph normalizer sanitizing untrusted third-party inputs"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-prompt-steganography-scrubber = "agent_prompt_steganography_scrubber.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_prompt_steganography_scrubber*"]
